<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4fb">
<title>Audio Dial</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#14121c; --surface:#1e1b2b; --surface2:#292539; --line:#38334e;
  --text:#f3f0fb; --muted:#a8a3bd; --accent:#c9bfff; --accent-ink:#1a1530; --star:#ffc83d;
  --later-min:60px;--cols:2;--tile-min:100px;--fav-w:158px;--t-fs:16px;--emoji-fs:22px;--tp:12px 44px 42px 12px;--badge-h:30px;--badge-fs:12px;--star-w:46px;--h2:19px;--preset-w:112px;--preset-h:68px;--preset-fs:15px;
  --tint-base:#1e1b2b;--tint-pct:16%;--badge-bg:rgba(255,255,255,.07);--bfg-pct:100%;--toast-bg:#f3f0fb;--toast-fg:#1a1530;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) calc(96px + env(safe-area-inset-bottom,0px)) env(safe-area-inset-left,0px);
}
body.locked{overflow:hidden}
body.size-m{--later-min:50px;--cols:2;--tile-min:84px;--fav-w:140px;--t-fs:14px;--emoji-fs:19px;--tp:10px 38px 36px 10px;--badge-h:26px;--badge-fs:11px;--star-w:40px;--h2:17px;--preset-w:100px;--preset-h:60px;--preset-fs:14px}
body.size-s{--later-min:44px;--cols:3;--tile-min:70px;--fav-w:118px;--t-fs:12.5px;--emoji-fs:17px;--tp:8px 28px 32px 8px;--badge-h:24px;--badge-fs:10.5px;--star-w:34px;--h2:16px;--preset-w:92px;--preset-h:54px;--preset-fs:13px}
body.editing .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
body.theme-light{--bg:#f6f4fb;--surface:#ffffff;--surface2:#ebe7f5;--line:#d8d3e6;--text:#1a1530;--muted:#645f7e;--accent:#5a49d6;--accent-ink:#ffffff;--star:#c98a00;--tint-base:#ffffff;--tint-pct:20%;--badge-bg:#ffffff;--bfg-pct:50%;--toast-bg:#1a1530;--toast-fg:#f3f0fb}
body.theme-light .btn.danger{color:#c0302a}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px}
.top h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.03em}
.pill-btn{height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--line);background:var(--surface);font-weight:650}

/* scrolling rows */
.scroll-row{display:flex;gap:10px;overflow-x:auto;margin:0 -14px;padding:2px 14px 12px;scrollbar-width:none;overscroll-behavior-x:contain}
.scroll-row::-webkit-scrollbar{display:none}

/* service launcher: chunky preset keys */
.preset{
  flex:0 0 auto;width:var(--preset-w);height:var(--preset-h);border-radius:18px;padding:10px 12px;
  display:flex;align-items:flex-end;text-decoration:none;
  background:var(--c);color:var(--ink);font-weight:800;font-size:var(--preset-fs);line-height:1.1;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.2);
}
.preset:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}

/* section titles */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px;min-height:44px}
.sec-head h2{margin:0;font-size:var(--h2);font-weight:750;letter-spacing:-.01em}
.hint{color:var(--muted);font-size:14px;margin:0 0 10px}

/* filters */
.filters{margin-top:6px}
#q{
  width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);
  color:var(--text);padding:0 14px;font-size:16px;margin-bottom:10px;
}
.chips{padding-bottom:6px}
.chip{
  flex:0 0 auto;height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);
  background:transparent;display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;
}
.chip i,.badge i,.l-badge i,.dot{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block}
.chip[aria-pressed=true]{background:var(--c,var(--accent));color:var(--ink,var(--accent-ink));border-color:transparent}
.chip[aria-pressed=true] i{background:var(--ink,var(--accent-ink))}

/* tiles */
.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:10px}
.scroll-row .tile{flex:0 0 var(--fav-w)}
.tile{position:relative;background:color-mix(in srgb,var(--c) var(--tint-pct),var(--tint-base));border-radius:16px;border-left:5px solid var(--c);min-height:var(--tile-min);overflow:hidden}
.tile:active{filter:brightness(.95)}
.tile.solid{background:var(--c);border-left:0;color:var(--ink)}
.tile.solid .badge{background:color-mix(in srgb,var(--ink) 14%,transparent);color:var(--ink)}
.tile.solid .badge i{background:var(--ink)}
.tile.solid .star,.tile.solid .star[aria-pressed=true]{color:var(--ink)}
.tile-link{
  display:block;width:100%;height:100%;min-height:var(--tile-min);padding:var(--tp);
  color:inherit;text-decoration:none;text-align:left;background:none;border:0;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
}
.emoji{display:block;font-size:var(--emoji-fs);line-height:1.1;margin-bottom:4px}
.t-title{font-weight:700;font-size:var(--t-fs);line-height:1.2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.badge{
  position:absolute;left:10px;bottom:7px;height:var(--badge-h);max-width:calc(100% - 20px);padding:0 10px 0 8px;border-radius:15px;border:0;
  background:var(--badge-bg);color:color-mix(in srgb,var(--c) var(--bfg-pct),#000);font-weight:650;font-size:var(--badge-fs);display:flex;align-items:center;gap:6px;
}
.badge span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.star{position:absolute;top:0;right:0;width:var(--star-w);height:var(--star-w);border:0;background:none;color:var(--muted);font-size:22px}
.star[aria-pressed=true]{color:var(--star)}
.tile-edit{position:absolute;right:4px;bottom:4px;display:flex;gap:2px}
.tile-edit .icon-btn{width:34px;height:34px;font-size:14px;background:var(--surface2)}
.tile-edit+.badge{max-width:calc(100% - 120px)}

/* categories */
.cat{margin-top:6px}
.cat-head{display:flex;align-items:center;gap:2px;margin:10px 0 8px}
.cat-toggle{flex:1;min-height:56px;display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;padding:0}
.chev{display:inline-block;width:30px;text-align:center;font-size:28px;line-height:1;color:var(--accent);transition:transform .15s}
.cat-toggle[aria-expanded=true] .chev{transform:rotate(90deg)}
.cat-name{font-size:var(--h2);font-weight:750;letter-spacing:-.01em}
.count{color:var(--muted);font-size:14px}
.empty{color:var(--muted);font-size:14px;padding:6px 0 12px}

/* icon buttons */
.icon-btn{width:44px;height:44px;border-radius:12px;border:0;background:none;color:var(--muted);font-size:17px;display:inline-flex;align-items:center;justify-content:center}
.icon-btn:disabled{opacity:.3}

/* listen later */
.later-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.later-item{display:flex;align-items:center;gap:4px;background:var(--surface);border-radius:14px;padding:4px 4px 4px 6px;min-height:var(--later-min)}
.later-item.done .l-title{text-decoration:line-through;color:var(--muted)}
.later-item.done .later-main{opacity:.65}
.tick{width:44px;height:44px;flex:0 0 auto;border-radius:50%;background:none;border:0;display:flex;align-items:center;justify-content:center;color:transparent;font-weight:800}
.tick::before{content:"";position:absolute;width:26px;height:26px;border-radius:50%;border:2px solid var(--muted)}
.tick{position:relative}
.tick span{position:relative;font-size:15px}
.tick[aria-pressed=true]{color:var(--accent-ink)}
.tick[aria-pressed=true]::before{background:var(--accent);border-color:var(--accent)}
.later-main{flex:1;min-width:0;padding:6px 4px;color:inherit;text-decoration:none;display:block}
.l-title{display:block;font-weight:650;font-size:var(--t-fs);overflow-wrap:anywhere}
.l-badge{display:inline-flex;align-items:center;gap:6px;color:color-mix(in srgb,var(--c) var(--bfg-pct),#000);font-size:var(--badge-fs);font-weight:650;margin-top:2px}
.later-add{display:flex;gap:8px;margin-top:10px}
.later-add input{flex:1;min-width:0;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:0 14px;font-size:16px}
.linkish{background:none;border:0;color:var(--accent);font-weight:650;padding:10px 4px;min-height:44px}

/* buttons + forms */
.btn{height:48px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);font-weight:650}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:#ff8f88}
.row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.row .btn{flex:1}
form label{display:block;font-size:14px;color:var(--muted);margin-top:12px}
form input[type=text],form select{
  display:block;width:100%;height:48px;margin-top:5px;border-radius:12px;border:1px solid var(--line);
  background:var(--bg);color:var(--text);padding:0 12px;font-size:16px;
}
form input[type=color]{display:block;width:100%;height:48px;margin-top:5px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:4px}
form label.check{display:flex;align-items:center;gap:12px;color:var(--text);min-height:48px;font-size:16px}
form input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent)}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(5,4,10,.65);z-index:40}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:640px;margin:0 auto;max-height:90vh;overflow-y:auto;
  background:var(--surface);border-radius:22px 22px 0 0;padding:6px 16px calc(18px + env(safe-area-inset-bottom,0px));
  animation:up .18s ease-out;
}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;min-height:56px}
.sheet-head h2{margin:0;font-size:20px;font-weight:750}
.menu{display:flex;flex-direction:column;gap:4px}
.menu button{height:54px;border:0;border-radius:12px;background:none;text-align:left;padding:0 10px;font-size:17px;font-weight:550}
.menu button:active{background:var(--surface2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0;width:100%}
.svc-list{list-style:none;margin:0;padding:0}
.svc-row{display:flex;align-items:center;gap:6px;min-height:54px}
.svc-row .dot{width:14px;height:14px;margin:0 6px}
.svc-name{flex:1;font-weight:600}
.svc-name small{color:var(--muted);font-weight:400}

/* edit bar + toast */
.editbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface2);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:none;align-items:center;justify-content:space-between;gap:12px}
.editbar.on{display:flex}
.editbar span{font-weight:650}
.editbar .btn{flex:0 0 auto}
#toast{
  position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);z-index:60;
  background:var(--toast-bg);color:var(--toast-fg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:15px;max-width:90vw;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}#toast,.chev{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>Audio Dial</h1>
    <button class="pill-btn" data-act="manage" type="button">Manage</button>
  </header>

  <nav id="launcher" class="scroll-row" aria-label="Open a music service"></nav>

  <section id="favs"></section>

  <section class="filters" aria-label="Search and filter">
    <input id="q" type="search" placeholder="Search your list" autocomplete="off" enterkeyhint="search">
    <div id="chips" class="scroll-row chips" role="group" aria-label="Filter by service"></div>
  </section>

  <section id="later"></section>
  <div id="cats"></div>
</div>

<div id="editbar" class="editbar"><span>Editing layout</span><button class="btn primary" data-act="edit-done" type="button">Done</button></div>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

     1. YOUR LIST  (edit this block to change the starting data)

     - This is only used the FIRST time the app opens on a phone (or after
       "Reset to starter list"). After that, your changes live on the phone
       and you edit things inside the app (Manage menu).

     - Every tile needs a "service" id from the services list and a "cat"

<script>
const SEED = {

    { pkg: "com.bandcamp.android", appHome: "x-bandcamp://open", id: "bandcamp",    name: "Bandcamp",      home: "https://bandcamp.com",          color: "#1da0c3", hosts: ["bandcamp.com"],              launcher: true  },

    { pkg: "fm.rinse.player", id: "rinsefm",     name: "Rinse FM",      home: "https://rinse.fm",              color: "#b6e83e", hosts: ["rinse.fm"],                  launcher: true  },

  ],

  // CATEGORIES (your own groupings, shown in this order)
  categories: [
    { id: "chill",   name: "Chill",         emoji: "🌊" },
    { id: "workout", name: "Workout",       emoji: "💪" },
    { id: "dnb",     name: "Drum & Bass",   emoji: "🥁" },
    { id: "dub",     name: "Reggae / Dub",  emoji: "🌴" },

  ],

  // TILES (sample entries: swap in your own)
  tiles: [
    { title: "Late-night chill",      url: "https://music.youtube.com/playlist?list=PL_EXAMPLE_CHILL", service: "ytmusic",     cat: "chill",   emoji: "🌙", fav: true  },
    { title: "BBC Radio 6 Music",     url: "https://www.bbc.co.uk/sounds/play/live:bbc_6music",        service: "bbc",         cat: "chill",   emoji: "🎧", fav: true  },
    { title: "Gym power hour",        url: "https://music.youtube.com/playlist?list=PL_EXAMPLE_GYM",   service: "ytmusic",     cat: "workout", emoji: "🔥", fav: false },
    { title: "Jungle & DnB mixes",    url: "https://www.mixcloud.com/discover/drum-and-bass/",         service: "mixcloud",    cat: "dnb",     emoji: "",   fav: false },

    { title: "Mix someone recommended", url: "https://www.mixcloud.com/NTSRadio/", done: false },

<script>
(function () {
'use strict';

/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
function inkFor(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
  if (!m) return '#ffffff';
  const n = parseInt(m[1], 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.45 ? '#1a1530' : '#ffffff';
}
function parseUrl(u) { try { return new URL(u); } catch (e) { return null; } }
function cleanUrl(raw) {
  let u = String(raw || '').trim();
  if (!u) return null;
  if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u;
  const p = parseUrl(u);
  if (!p || !/^https?:$/.test(p.protocol) || !p.hostname.includes('.')) return null;
  return p.href;
}
function extractUrl(text) {
  const m = /https?:\/\/[^\s<>"']+/i.exec(String(text || ''));
  return m ? m[0].replace(/[.,;)]+$/, '') : null;
}

/* ---------- guess a name from a link (no lookups, just the words in the link) ---------- */
function humanise(s) {
  let t; try { t = decodeURIComponent(s); } catch (e) { t = s; }
  t = t.replace(/[-_+]+/g, ' ').replace(/\s+/g, ' ').trim();
  return t ? t.charAt(0).toUpperCase() + t.slice(1) : '';
}
function guessTitle(url) {
  const p = parseUrl(url); if (!p) return '';
  const host = p.hostname.toLowerCase().replace(/^www\./, '');
  const segs = p.pathname.split('/').filter(Boolean);
  const on = d => host === d || host.endsWith('.' + d);
  let out = '';
  if (on('tunein.com')) {
    if (segs[0] === 'radio' && segs[1]) out = humanise(segs[1].replace(/-[a-z]\d+$/i, ''));
  } else if (on('radio.net')) {
    if (segs[0] === 's' && segs[1]) out = humanise(segs[1]);
  } else if (on('mixcloud.com')) {
    if (segs[0] !== 'discover' && segs.length >= 2) out = humanise(segs[1]);
    else if (segs.length === 1 && !['discover', 'upload'].includes(segs[0])) out = humanise(segs[0]);
  } else if (on('bbc.co.uk') || on('bbc.com')) {
    const last = segs[segs.length - 1] || '';
    if (/^live:/.test(last)) {
      const id = last.slice(5);
      out = /^bbc_/i.test(id) ? 'BBC ' + id.slice(4).replace(/[-_]+/g, ' ') : humanise(id);
    }
  } else if (on('bandcamp.com')) {
    const sub = host.replace(/\.?bandcamp\.com$/, '');
    const item = (segs[0] === 'album' || segs[0] === 'track') && segs[1] ? humanise(segs[1]) : '';
    const artist = sub ? humanise(sub) : '';
    out = item && artist ? item + ' – ' + artist : (item || artist);
  } else if (on('player.fm')) {
    if (segs[0] === 'series' && segs[1]) out = humanise(segs[1].replace(/-?\d+$/, ''));
  }
  return out.slice(0, 80);
}

/* ---------- opening links in apps (Android) ---------- */
const isAndroid = /Android/i.test(navigator.userAgent || '');
function intentFor(url, pkg, fallback) {
  const u = parseUrl(url); if (!u) return '';
  return 'intent://' + u.host + u.pathname + u.search + '#Intent;scheme=' + u.protocol.replace(':', '') + ';package=' + pkg + ';S.browser_fallback_url=' + encodeURIComponent(fallback) + ';end';
}
function linkAttrs(url, svc) {
  if (isAndroid && svc && svc.pkg) { const i = intentFor(url, svc.pkg, url); if (i) return `href="${esc(i)}"`; }
  return `href="${esc(url)}" target="_blank" rel="noopener noreferrer"`;
}
function launchAttrs(svc) {
  if (isAndroid && svc.pkg && svc.appHome) { const i = intentFor(svc.appHome, svc.pkg, svc.home || svc.appHome); if (i) return `href="${esc(i)}"`; }
  return linkAttrs(svc.home, svc);
}

/* ---------- state ---------- */
const KEY = 'dial.v1';
const OTHER = { id: '', name: 'Other', home: '', color: '#8d89a3', hosts: [], launcher: false };
let state;
const UI = { filter: '', q: '', edit: false };
let warned = false;

function sanitize(s) {
  return {
    v: 4,
    size: ['s', 'm', 'l'].includes(s.size) ? s.size : 'm',
    theme: ['dark', 'light', 'auto'].includes(s.theme) ? s.theme : 'light',
    services: s.services.map(x => ({
      id: String(x.id || uid()), name: String(x.name || 'Service'), home: cleanUrl(x.home) || '',
      color: /^#[0-9a-f]{6}$/i.test(x.color) ? x.color : '#8d89a3',
      hosts: Array.isArray(x.hosts) ? x.hosts.map(h => String(h).toLowerCase()) : [], launcher: !!x.launcher,
      pkg: /^[A-Za-z]\w*(\.\w+)+$/.test(String(x.pkg || '').trim()) ? String(x.pkg).trim() : '',
      appHome: /^[a-z][a-z0-9+.-]*:\/\/\S+$/i.test(String(x.appHome || '').trim()) ? String(x.appHome).trim() : ''
    })),
    categories: s.categories.map(c => ({ id: String(c.id || uid()), name: String(c.name || 'Untitled'), emoji: String(c.emoji || ''), collapsed: !!c.collapsed })),
    tiles: s.tiles.map(t => ({
      id: String(t.id || uid()), title: String(t.title || 'Untitled'), url: cleanUrl(t.url),
      service: String(t.service || ''), cat: String(t.cat || ''), emoji: String(t.emoji || ''), fav: !!t.fav
    })).filter(t => t.url),
    later: s.later.map(l => ({ id: String(l.id || uid()), title: String(l.title || 'Saved link'), url: cleanUrl(l.url), done: !!l.done, added: l.added || Date.now() })).filter(l => l.url),
    laterCollapsed: !!s.laterCollapsed
  };
}
const validShape = s => s && Array.isArray(s.services) && Array.isArray(s.categories) && Array.isArray(s.tiles) && Array.isArray(s.later);
// Older saved data gets Bandcamp and Player FM added once (unless you already added them yourself).
function migrate(st, fromV) {
  if (fromV < 2) {
    SEED.services.filter(x => x.id === 'bandcamp' || x.id === 'playerfm').forEach(def => {
      if (!st.services.some(x => x.id === def.id || x.hosts.includes(def.hosts[0]))) {
        st.services.push(sanitize({ services: [def], categories: [], tiles: [], later: [] }).services[0]);
      }
    });
  }
  if (fromV < 4) {
    SEED.services.forEach(def => {
      const have = st.services.find(x => x.id === def.id || x.hosts.includes(def.hosts[0]));
      if (have) {
        if (!have.pkg && def.pkg) have.pkg = def.pkg;
        if (!have.appHome && def.appHome) have.appHome = def.appHome;
      } else if (def.id === 'rinsefm') {
        st.services.push(sanitize({ services: [def], categories: [], tiles: [], later: [] }).services[0]);
      }
    });
  }
  return st;
}
const fromRaw = s => migrate(sanitize(s), Number(s.v) || 1);
function loadState() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const s = JSON.parse(raw); if (validShape(s)) return fromRaw(s); }
  } catch (e) { /* fall through to the starter list */ }
  return sanitize(clone(SEED));
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { if (!warned) { warned = true; toast('Could not save on this device'); } }
}
function commit() { save(); renderAll(); }

const svcOf = id => state.services.find(s => s.id === id) || OTHER;
const catOf = id => state.categories.find(c => c.id === id);
function detectService(url) {
  const p = parseUrl(url);
  if (!p) return '';
  const h = p.hostname.toLowerCase();
  let best = '', len = 0;
  state.services.forEach(s => (s.hosts || []).forEach(x => {
    if ((h === x || h.endsWith('.' + x)) && x.length > len) { best = s.id; len = x.length; }
  }));
  return best;
}

/* ---------- toast ---------- */
let tt;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 2800);
}

/* ---------- filtering ---------- */
const filtering = () => !UI.edit && !!(UI.filter || UI.q);
const matches = (text, svcId) => !filtering() || ((!UI.filter || svcId === UI.filter) && (!UI.q || text.toLowerCase().includes(UI.q)));

function renderLauncher() {

function tileHTML(t, solid) {

function renderLater() {
  const prev = $('#laterInput') ? $('#laterInput').value : '';
  const items = state.later.filter(l => matches(l.title + ' ' + svcOf(detectService(l.url)).name, detectService(l.url)));
  const sorted = items.filter(l => !l.done).concat(items.filter(l => l.done));
  const pending = state.later.filter(l => !l.done).length;
  const doneCount = state.later.filter(l => l.done).length;
  const open = !state.laterCollapsed || filtering();
  const rows = sorted.map(l => {
    const s = svcOf(detectService(l.url));
    return `<li class="later-item ${l.done ? 'done' : ''}">
      <button type="button" class="tick" data-act="later-toggle" data-id="${l.id}" aria-pressed="${l.done}" aria-label="${l.done ? 'Mark as not done' : 'Mark as done'}"><span>✓</span></button>
      <a class="later-main" ${linkAttrs(l.url, s)}><span class="l-title">${esc(l.title)}</span><span class="l-badge" style="--c:${esc(s.color)}"><i></i>${esc(s.name)}</span></a>
      <button type="button" class="icon-btn" data-act="later-edit" data-id="${l.id}" aria-label="Edit">✎</button>
      <button type="button" class="icon-btn" data-act="later-del" data-id="${l.id}" aria-label="Delete">✕</button>
    </li>`;
  }).join('');
  $('#later').innerHTML = `
    <div class="sec-head">
      <button type="button" class="cat-toggle" data-act="toggle-later" aria-expanded="${open}"><span class="chev">▸</span><span class="cat-name">Listen later</span><span class="count">${pending}</span></button>
      ${doneCount ? `<button type="button" class="linkish" data-act="later-clear">Clear ${doneCount} done</button>` : ''}
    </div>` + (open ? `
    ${rows ? `<ul class="later-list">${rows}</ul>` : `<p class="empty">${state.later.length ? 'Nothing matches your search.' : 'Nothing saved yet. Paste a link below, or share one to Audio Dial from another app.'}</p>`}
    <form id="laterForm" class="later-add"><input id="laterInput" type="text" inputmode="url" placeholder="Paste a link to save" autocomplete="off" aria-label="Link to save"><button class="btn primary" type="submit">Save</button></form>` : '');
  if ($('#laterInput') && prev) $('#laterInput').value = prev;

function renderCats() {
  const html = state.categories.map((c, ci) => {
    const tiles = state.tiles.filter(t => t.cat === c.id && matches(t.title + ' ' + svcOf(t.service).name + ' ' + c.name, t.service));

    const editBtns = UI.edit ? `
      <button class="icon-btn" data-act="cat-up" data-id="${c.id}" aria-label="Move section up" ${ci === 0 ? 'disabled' : ''}>▲</button>

    return `<section class="cat">

const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

}

      const home = f.elements.home.value.trim() ? cleanUrl(f.elements.home.value) : '';
      if (f.elements.home.value.trim() && !home) { toast('That home page link does not look right'); return; }
      const hosts = f.elements.hosts.value.split(/[,\s]+/).map(h => h.toLowerCase().replace(/^https?:\/\//, '').replace(/^www\./, '').replace(/\/.*$/, '')).filter(Boolean);
      const pkg = f.elements.pkg.value.trim(), appHome = f.elements.appHome.value.trim();
      if (pkg && !/^[A-Za-z]\w*(\.\w+)+$/.test(pkg)) { toast('The app ID should look like com.example.app'); return; }
      if (appHome && !/^[a-z][a-z0-9+.-]*:\/\/\S+$/i.test(appHome)) { toast('The app launch link should look like x-example://open'); return; }
      const rec = { name: f.elements.name.value.trim() || 'Service', home, color: f.elements.color.value, hosts, launcher: f.elements.launcher.checked, pkg, appHome };
      if (s) Object.assign(s, rec); else state.services.push(Object.assign({ id: uid() }, rec));
      save(); renderAll(); servicesSheet();
    };
  });
}

function laterEditSheet(id) {
  const l = state.later.find(x => x.id === id); if (!l) return;
  openSheet('Edit saved link', `<form id="f" autocomplete="off">
    <label>Title<input type="text" name="title" value="${esc(l.title)}" required></label>
    <label>Link<input type="text" name="url" inputmode="url" value="${esc(l.url)}"></label>
    <div class="row"><button type="button" class="btn" data-act="close-sheet">Cancel</button><button type="submit" class="btn primary">Save</button></div>
  </form>`, b => {
    const f = $('#f', b);
    f.onsubmit = e => {
      e.preventDefault();
      const url = cleanUrl(f.elements.url.value);
      if (!url) { toast('That link does not look right'); return; }
      l.title = f.elements.title.value.trim() || l.title; l.url = url;
      closeSheet(); commit();
    };
  });
}

/* ---------- listen later ---------- */
function addLater(url, title) {
  const u = cleanUrl(url);
  if (!u) return false;
  if (state.later.some(l => l.url === u && !l.done)) { toast('Already in Listen later'); return true; }
  const s = svcOf(detectService(u));
  state.later.unshift({ id: uid(), title: (title && title.trim()) || guessTitle(u) || (s.id ? s.name + ' link' : parseUrl(u).hostname.replace(/^www\./, '')), url: u, done: false, added: Date.now() });
  state.laterCollapsed = false;
  commit(); toast('Saved to Listen later');
  return true;
}

/* ---------- backup ---------- */
function exportBackup() {
  const data = JSON.stringify(Object.assign({ app: 'dial', exportedAt: new Date().toISOString() }, state), null, 2);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  a.download = 'audio-dial-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('Backup downloaded');
}
function importBackup() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => {
    const file = inp.files && inp.files[0]; if (!file) return;
    file.text().then(txt => {
      let s; try { s = JSON.parse(txt); } catch (e) { toast('That file is not a valid backup'); return; }
      if (!validShape(s)) { toast('That file is not an Audio Dial backup'); return; }
      confirmSheet('Replace everything on this phone with the backup? Your current tiles and saved links will be overwritten.', 'Replace', () => {
        state = fromRaw(s); UI.filter = ''; commit(); toast('Backup loaded');
      });
    });
  };
  inp.click();
}

/* ---------- moving things around ---------- */
function moveIn(arr, id, dir) {
  const i = arr.findIndex(x => x.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
}
function moveTile(id, dir) {
  const t = state.tiles.find(x => x.id === id); if (!t) return;
  const same = state.tiles.map((x, i) => x.cat === t.cat ? i : -1).filter(i => i >= 0);
  const i = state.tiles.indexOf(t), swap = same[same.indexOf(i) + dir];
  if (swap == null) return;
  [state.tiles[i], state.tiles[swap]] = [state.tiles[swap], state.tiles[i]];
  commit();
}
function toggleFav(id, viaHold) {
  const t = state.tiles.find(x => x.id === id); if (!t) return;
  t.fav = !t.fav; commit();
  toast(t.fav ? 'Added to Favourites' : 'Removed from Favourites');
  if (viaHold && navigator.vibrate) navigator.vibrate(25);
}
function setFilter(id) {
  UI.filter = UI.filter === id ? '' : id;
  renderChips(); renderLater(); renderCats();
  if (UI.filter) toast('Showing ' + svcOf(UI.filter).name + ' only. Tap again to clear.');
}

/* ---------- press-and-hold on a tile = favourite ---------- */
let holdTimer = null, held = false, hx = 0, hy = 0;
document.addEventListener('pointerdown', e => {
  held = false; clearTimeout(holdTimer);
  const link = e.target.closest('.tile-link');
  if (!link || UI.edit || !link.dataset.id) return;
  hx = e.clientX; hy = e.clientY;
  holdTimer = setTimeout(() => { held = true; if (navigator.vibrate) navigator.vibrate(25); tileMenu(link.dataset.id); }, 550);
});
document.addEventListener('pointermove', e => { if (holdTimer && (Math.abs(e.clientX - hx) > 10 || Math.abs(e.clientY - hy) > 10)) { clearTimeout(holdTimer); holdTimer = null; } });
['pointerup', 'pointercancel'].forEach(n => document.addEventListener(n, () => { clearTimeout(holdTimer); holdTimer = null; }));
document.addEventListener('contextmenu', e => { if (e.target.closest('.tile-link')) e.preventDefault(); });

/* ---------- clicks ---------- */
document.addEventListener('click', e => {
  if (held) { held = false; e.preventDefault(); e.stopPropagation(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch (act) {
    case 'manage': manageSheet(); break;
    case 'size-menu': sizeSheet(); break;
    case 'theme-menu': themeSheet(); break;
    case 'theme': state.theme = el.dataset.theme; save(); renderAll(); themeSheet(); break;
    case 'size': state.size = el.dataset.size; save(); renderAll(); sizeSheet(); break;
    case 'tm-edit': tileSheet(id); break;
    case 'tm-fav': closeSheet(); toggleFav(id); break;
    case 'tm-del': delTile(id); break;
    case 'close-sheet': closeSheet(); break;
    case 'add-tile': tileSheet(); break;
    case 'add-cat': catSheet(); break;
    case 'edit-mode': closeSheet(); UI.edit = true; renderAll(); break;
    case 'edit-done': UI.edit = false; renderAll(); break;
    case 'services': servicesSheet(); break;
    case 'svc-add': svcSheet(); break;
    case 'svc-edit': svcSheet(id); break;
    case 'svc-up': moveIn(state.services, id, -1); save(); renderAll(); servicesSheet(); break;
    case 'svc-down': moveIn(state.services, id, 1); save(); renderAll(); servicesSheet(); break;
    case 'export': closeSheet(); exportBackup(); break;
    case 'import': closeSheet(); importBackup(); break;
    case 'install': if (deferredInstall) { closeSheet(); deferredInstall.prompt(); deferredInstall = null; } break;
    case 'reset': confirmSheet('Go back to the starter list? This removes your own tiles, sections and saved links from this phone.', 'Reset', () => { state = sanitize(clone(SEED)); UI.filter = ''; UI.q = ''; $('#q').value = ''; commit(); toast('Starter list restored'); }); break;
    case 'star': toggleFav(id); break;
    case 'filter-service': setFilter(el.dataset.svc); break;
    case 'chip': UI.filter = el.dataset.svc; renderChips(); renderLater(); renderCats(); break;
    case 'edit-tile': tileSheet(id); break;
    case 'tile-left': moveTile(id, -1); break;
    case 'tile-right': moveTile(id, 1); break;
    case 'del-tile': delTile(id); break;
    case 'toggle-cat': { const c = catOf(id); if (c && !UI.edit) { c.collapsed = !c.collapsed; save(); renderCats(); } break; }
    case 'cat-up': moveIn(state.categories, id, -1); commit(); break;
    case 'cat-down': moveIn(state.categories, id, 1); commit(); break;
    case 'cat-edit': catSheet(id); break;
    case 'cat-del': delCat(id); break;
    case 'toggle-later': state.laterCollapsed = !state.laterCollapsed; save(); renderLater(); break;
    case 'later-toggle': { const l = state.later.find(x => x.id === id); if (l) { l.done = !l.done; commit(); } break; }
    case 'later-edit': laterEditSheet(id); break;
    case 'later-del': state.later = state.later.filter(x => x.id !== id); commit(); break;
    case 'later-clear': state.later = state.later.filter(x => !x.done); commit(); break;
  }
}, true);

document.addEventListener('submit', e => {
  if (e.target.id === 'laterForm') {
    e.preventDefault();
    const inp = $('#laterInput'), v = inp.value.trim();
    if (!v) return;
    if (addLater(v)) { const again = $('#laterInput'); if (again) again.value = ''; }
    else toast('That does not look like a link');
  }
});
$('#q').addEventListener('input', e => { UI.q = e.target.value.trim().toLowerCase(); renderLater(); renderCats(); });

/* ---------- Share menu: links arrive as ?title=…&text=…&url=… ---------- */
function handleShare() {
  const p = new URLSearchParams(location.search);
  if (!(p.has('url') || p.has('text') || p.has('title'))) return;
  const title = p.get('title') || '', text = p.get('text') || '', url = p.get('url') || '';
  const link = extractUrl(url) || extractUrl(text) || extractUrl(title);
  history.replaceState({}, '', location.pathname);
  if (!link) { toast('No link found in what you shared'); return; }
  const rest = text.replace(link, '').trim();
  const name = (rest && rest.length < 120 ? rest : '') || (title && !extractUrl(title) ? title : '');
  addLater(link, name);
}

/* ---------- start ---------- */
state = loadState();
renderAll();
handleShare();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();
</script>
</body>
